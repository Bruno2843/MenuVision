        </g>

        <g transform="translate(742 456) rotate(12)">
            <ellipse cx="0" cy="78" rx="118" ry="30" fill="#000" opacity="0.55" filter="url(#sombra)"/>
            <path d="M-110 56c-14-64 40-112 110-112s124 48 110 112c-26 22-194 22-220 0Z" fill="url(#masaE)"/>
            <path d="M-40 54c-8-50 22-86 40-86s48 36 40 86Z" fill="url(#relleno)" opacity="0.85"/>
            <path d="M-110 56c-14-64 40-112 110-112 24 0 44 6 62 16-50 24-86 60-92 96-28 4-54 4-80 0Z" fill="#FBD79C" opacity="0.4"/>
            <g stroke="#8E5A1C" stroke-opacity="0.45" stroke-width="3" fill="none">
