    <g fill="#4E8A2C">
        <path d="M842 372c24-18 50-12 58 6-11 24-38 31-59 16-12-8-11-18 1-22Z"/>
        <path d="M330 386c22-16 46-10 53 7-10 22-35 28-54 14-11-8-10-17 1-21Z"/>
