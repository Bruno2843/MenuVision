<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.25" y2="1">
            <stop offset="0%" stop-color="#2A2014"/>
            <stop offset="50%" stop-color="#14110C"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="30%" cy="12%" r="68%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="platoE" cx="34%" cy="26%" r="80%">
            <stop offset="0%" stop-color="#FBF9F3"/>
            <stop offset="58%" stop-color="#E0DACE"/>
            <stop offset="100%" stop-color="#938B7E"/>
        </radialGradient>

        <linearGradient id="masaE" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#F0C583"/>
            <stop offset="52%" stop-color="#D39547"/>
            <stop offset="100%" stop-color="#8E5A1C"/>
        </linearGradient>

        <radialGradient id="relleno" cx="42%" cy="36%" r="74%">
            <stop offset="0%" stop-color="#B4552A"/>
            <stop offset="55%" stop-color="#7E3316"/>
            <stop offset="100%" stop-color="#4A1B0A"/>
        </radialGradient>

        <radialGradient id="vineta" cx="50%" cy="46%" r="73%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.94"/>
        </radialGradient>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="21"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="97"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.45">
        <circle cx="1080" cy="212" r="30" fill="#F0C64A" opacity="0.5"/>
        <circle cx="128" cy="596" r="22" fill="#D6A928" opacity="0.35"/>
    </g>

    <ellipse cx="600" cy="560" rx="322" ry="120" fill="#000" opacity="0.74" filter="url(#sombra)"/>
    <ellipse cx="600" cy="452" rx="300" ry="164" fill="url(#platoE)"/>
    <ellipse cx="600" cy="452" rx="300" ry="164" fill="none" stroke="#08090B" stroke-opacity="0.22" stroke-width="3"/>

    <g>
        <g transform="translate(430 400) rotate(-14)">
            <ellipse cx="0" cy="86" rx="132" ry="34" fill="#000" opacity="0.55" filter="url(#sombra)"/>
            <path d="M-124 62c-16-72 44-124 124-124s140 52 124 124c-30 26-218 26-248 0Z" fill="url(#masaE)"/>
            <path d="M-46 60c-10-56 24-96 46-96s56 40 46 96Z" fill="url(#relleno)" opacity="0.85"/>
            <path d="M-124 62c-16-72 44-124 124-124 26 0 50 6 70 18-56 26-96 66-104 106-32 4-64 4-90 0Z" fill="#FBD79C" opacity="0.4"/>
            <g stroke="#8E5A1C" stroke-opacity="0.45" stroke-width="3" fill="none">
                <path d="M-70 -46c22 22 34 54 30 100"/>
                <path d="M-14 -58c-12 30-14 66-6 106"/>
                <path d="M44 -50c-18 26-28 60-26 100"/>
