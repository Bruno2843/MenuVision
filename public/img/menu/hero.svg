<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#2E2416"/>
            <stop offset="45%" stop-color="#17130D"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="66%" cy="6%" r="72%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.34"/>
            <stop offset="48%" stop-color="#D6A928" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="platoH" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#FAF7F0"/>
            <stop offset="58%" stop-color="#DDD6C9"/>
            <stop offset="100%" stop-color="#8D8577"/>
        </linearGradient>

        <radialGradient id="masaH" cx="36%" cy="28%" r="80%">
            <stop offset="0%" stop-color="#EFC071"/>
            <stop offset="55%" stop-color="#CE8C3A"/>
            <stop offset="100%" stop-color="#7E4C1D"/>
        </radialGradient>

        <radialGradient id="salsaH" cx="40%" cy="32%" r="78%">
            <stop offset="0%" stop-color="#C4462A"/>
            <stop offset="100%" stop-color="#5E1A0E"/>
        </radialGradient>

        <radialGradient id="quesoH" cx="34%" cy="26%" r="82%">
            <stop offset="0%" stop-color="#FBF0CB"/>
            <stop offset="55%" stop-color="#EDCE88"/>
            <stop offset="100%" stop-color="#BF9042"/>
        </radialGradient>

        <linearGradient id="panH" x1="0.15" y1="0" x2="0.75" y2="1">
            <stop offset="0%" stop-color="#F0BE6C"/>
            <stop offset="48%" stop-color="#D29537"/>
            <stop offset="100%" stop-color="#8B5518"/>
        </linearGradient>

        <linearGradient id="carneH" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6B3A1E"/>
            <stop offset="100%" stop-color="#2A1208"/>
        </linearGradient>

        <linearGradient id="vinoH" x1="0.3" y1="0" x2="0.7" y2="1">
            <stop offset="0%" stop-color="#8C1626"/>
            <stop offset="100%" stop-color="#2C060C"/>
        </linearGradient>

        <radialGradient id="vineta" cx="52%" cy="46%" r="72%">
            <stop offset="46%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.9"/>
        </radialGradient>

        <filter id="borde" x="-12%" y="-12%" width="124%" height="124%">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="13" result="ruido"/>
            <feDisplacementMap in="SourceGraphic" in2="ruido" scale="14" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <filter id="derretido" x="-12%" y="-12%" width="124%" height="124%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="29" result="ruido"/>
            <feDisplacementMap in="SourceGraphic" in2="ruido" scale="20" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="24"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="26"/>
        </filter>

        <filter id="medio" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="11"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1600" height="600" fill="url(#mesa)"/>
    <rect width="1600" height="600" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.55">
        <circle cx="1470" cy="120" r="40" fill="#F0C64A" opacity="0.55"/>
        <circle cx="1560" cy="212" r="22" fill="#F7D978" opacity="0.4"/>
        <circle cx="1372" cy="196" r="18" fill="#D6A928" opacity="0.4"/>
    </g>

    <g filter="url(#medio)" opacity="0.65">
        <ellipse cx="1188" cy="152" rx="118" ry="46" fill="#F0C64A" opacity="0.22"/>
        <ellipse cx="700" cy="96" rx="160" ry="40" fill="#D6A928" opacity="0.14"/>
    </g>

    <g transform="translate(1130 350)">
        <ellipse cx="0" cy="150" rx="286" ry="72" fill="#000" opacity="0.6" filter="url(#desenfoque)"/>
        <ellipse cx="0" cy="30" rx="252" ry="128" fill="url(#platoH)"/>
        <ellipse cx="0" cy="30" rx="252" ry="128" fill="none" stroke="#08090B" stroke-opacity="0.22" stroke-width="3"/>

        <ellipse cx="0" cy="26" rx="206" ry="100" fill="#000" opacity="0.5" filter="url(#medio)"/>
        <g filter="url(#borde)">
            <circle cx="0" cy="20" r="196" fill="url(#masaH)"/>
        </g>
        <g filter="url(#derretido)">
            <circle cx="0" cy="20" r="156" fill="url(#salsaH)"/>
            <circle cx="0" cy="20" r="150" fill="url(#quesoH)" opacity="0.94"/>
        </g>
        <g fill="#A9752C" opacity="0.45">
            <ellipse cx="-58" cy="-14" rx="26" ry="16"/>
            <ellipse cx="46" cy="52" rx="30" ry="18"/>
            <ellipse cx="18" cy="-40" rx="18" ry="11"/>
        </g>
        <g fill="#5E8F3E">
            <path d="M-40 -44c22-14 44-5 49 11-9 18-32 24-50 13-10-7-9-19 1-24Z"/>
            <path d="M64 60c20-12 40-4 44 10-8 16-29 21-45 11-9-6-8-17 1-21Z"/>
        </g>
    </g>

    <g transform="translate(1440 330)">
        <ellipse cx="0" cy="188" rx="96" ry="30" fill="#000" opacity="0.7" filter="url(#desenfoque)"/>
        <path d="M-58 168h116l-14 12a20 20 0 0 1-12 6h-64a20 20 0 0 1-12-6Z" fill="url(#platoH)"/>
        <path d="M-52 26h104c8 0 14 8 13 16l-12 132H-53L-65 42c-1-8 5-16 13-16Z" fill="url(#vinoH)" opacity="0.92"/>
        <ellipse cx="0" cy="26" rx="52" ry="14" fill="#B21F32" opacity="0.6"/>
        <ellipse cx="-18" cy="22" rx="22" ry="7" fill="#F7D978" opacity="0.3"/>
        <path d="M-40 96c28 10 56 10 84 0" stroke="#F7F3EA" stroke-opacity="0.16" stroke-width="3" fill="none"/>
    </g>

    <g transform="translate(700 470) scale(0.72)">
        <ellipse cx="0" cy="120" rx="250" ry="60" fill="#000" opacity="0.66" filter="url(#desenfoque)"/>
        <rect x="-46" y="-30" width="92" height="46" rx="20" fill="url(#panH)"/>
        <rect x="-48" y="8" width="96" height="26" rx="12" fill="url(#carneH)"/>
        <rect x="-52" y="-4" width="104" height="18" rx="9" fill="#F0C64A" opacity="0.55"/>
        <path d="M-56 -38c-16-92 22-152 56-152s72 60 56 152Z" fill="url(#panH)"/>
        <g fill="#FBF0CE" opacity="0.8">
            <ellipse cx="-18" cy="-118" rx="11" ry="6" transform="rotate(-20 -18 -118)"/>
            <ellipse cx="22" cy="-138" rx="11" ry="6" transform="rotate(10 22 -138)"/>
            <ellipse cx="34" cy="-72" rx="10" ry="5" transform="rotate(26 34 -72)"/>
        </g>
    </g>

    <rect width="1600" height="600" fill="url(#vineta)"/>
    <rect width="1600" height="600" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
