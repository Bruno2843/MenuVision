<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#2C2317"/>
            <stop offset="52%" stop-color="#15120E"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="50%" cy="8%" r="68%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="tabla" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#54381F"/>
            <stop offset="55%" stop-color="#33210F"/>
            <stop offset="100%" stop-color="#1B1006"/>
        </linearGradient>

        <radialGradient id="cuenco" cx="36%" cy="28%" r="78%">
            <stop offset="0%" stop-color="#FBF8F1"/>
            <stop offset="58%" stop-color="#DFD8CA"/>
            <stop offset="100%" stop-color="#8E8678"/>
        </radialGradient>

        <radialGradient id="verde" cx="38%" cy="30%" r="76%">
            <stop offset="0%" stop-color="#8FBE55"/>
            <stop offset="100%" stop-color="#3A6A20"/>
        </radialGradient>

        <radialGradient id="tomateE" cx="38%" cy="30%" r="76%">
            <stop offset="0%" stop-color="#E2643F"/>
            <stop offset="100%" stop-color="#8C1E0F"/>
        </radialGradient>

        <radialGradient id="cremaE" cx="38%" cy="30%" r="76%">
            <stop offset="0%" stop-color="#FAEFCF"/>
            <stop offset="100%" stop-color="#C7A85C"/>
        </radialGradient>

        <radialGradient id="vineta" cx="50%" cy="46%" r="73%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.94"/>
        </radialGradient>

        <filter id="borde" x="-12%" y="-12%" width="124%" height="124%">
            <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="83" result="ruido"/>
            <feDisplacementMap in="SourceGraphic" in2="ruido" scale="10" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="89"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.45">
        <circle cx="1092" cy="188" r="28" fill="#F0C64A" opacity="0.5"/>
        <circle cx="110" cy="628" r="24" fill="#D6A928" opacity="0.35"/>
    </g>

    <g transform="rotate(-2 600 440)">
        <rect x="176" y="200" width="856" height="500" rx="28" fill="#000" opacity="0.68" filter="url(#sombra)"/>
        <rect x="184" y="186" width="856" height="500" rx="26" fill="url(#tabla)"/>
        <rect x="184" y="186" width="856" height="500" rx="26" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>

        <g>
            <ellipse cx="396" cy="330" rx="128" ry="86" fill="#000" opacity="0.6" filter="url(#sombra)"/>
            <ellipse cx="396" cy="316" rx="126" ry="82" fill="url(#cuenco)"/>
            <ellipse cx="396" cy="310" rx="100" ry="62" fill="url(#verde)"/>
            <g fill="#B9D97C" opacity="0.5">
                <ellipse cx="366" cy="292" rx="24" ry="10" transform="rotate(-18 366 292)"/>
                <ellipse cx="424" cy="326" rx="20" ry="8" transform="rotate(12 424 326)"/>
            </g>
        </g>

        <g>
            <ellipse cx="796" cy="342" rx="124" ry="82" fill="#000" opacity="0.6" filter="url(#sombra)"/>
            <ellipse cx="796" cy="328" rx="122" ry="78" fill="url(#cuenco)"/>
            <ellipse cx="796" cy="322" rx="96" ry="58" fill="url(#tomateE)"/>
            <g fill="#F2A183" opacity="0.55">
                <ellipse cx="768" cy="306" rx="22" ry="9" transform="rotate(-14 768 306)"/>
                <ellipse cx="826" cy="338" rx="18" ry="7" transform="rotate(10 826 338)"/>
            </g>
        </g>

        <g>
            <ellipse cx="586" cy="560" rx="140" ry="86" fill="#000" opacity="0.6" filter="url(#sombra)"/>
            <ellipse cx="586" cy="546" rx="138" ry="82" fill="url(#cuenco)"/>
            <ellipse cx="586" cy="540" rx="110" ry="64" fill="url(#cremaE)"/>
            <g fill="#FFF8E2" opacity="0.5">
                <ellipse cx="552" cy="522" rx="26" ry="10" transform="rotate(-16 552 522)"/>
                <ellipse cx="618" cy="556" rx="22" ry="9" transform="rotate(12 618 556)"/>
            </g>
        </g>

        <g filter="url(#borde)">
            <ellipse cx="320" cy="566" rx="86" ry="54" fill="#C98A3C"/>
            <ellipse cx="852" cy="562" rx="86" ry="54" fill="#C98A3C"/>
        </g>
        <ellipse cx="320" cy="566" rx="70" ry="42" fill="#8A5522" opacity="0.5"/>
        <ellipse cx="852" cy="562" rx="70" ry="42" fill="#8A5522" opacity="0.5"/>

        <g fill="#4E8A2C" opacity="0.8">
            <ellipse cx="470" cy="620" rx="34" ry="16" transform="rotate(-8 470 620)"/>
            <ellipse cx="700" cy="626" rx="32" ry="15" transform="rotate(9 700 626)"/>
        </g>
    </g>

    <rect width="1200" height="800" fill="url(#vineta)"/>
    <rect width="1200" height="800" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
