<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#2A2116"/>
            <stop offset="52%" stop-color="#15110D"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="30%" cy="10%" r="68%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="plato" cx="34%" cy="24%" r="80%">
            <stop offset="0%" stop-color="#FBF9F4"/>
            <stop offset="56%" stop-color="#E2DCD0"/>
            <stop offset="100%" stop-color="#9A9285"/>
        </radialGradient>

        <linearGradient id="cacao" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0%" stop-color="#6B4526"/>
            <stop offset="55%" stop-color="#4A2A15"/>
            <stop offset="100%" stop-color="#2B160A"/>
        </linearGradient>

        <linearGradient id="cremaR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FBF1D8"/>
            <stop offset="100%" stop-color="#D8C08A"/>
        </linearGradient>

        <linearGradient id="esponja" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E0B169"/>
            <stop offset="100%" stop-color="#A9722C"/>
        </linearGradient>

        <radialGradient id="vineta" cx="50%" cy="46%" r="73%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.93"/>
        </radialGradient>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>

        <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="61"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.45">
        <circle cx="1088" cy="196" r="30" fill="#F0C64A" opacity="0.5"/>
        <circle cx="112" cy="600" r="22" fill="#D6A928" opacity="0.35"/>
    </g>

    <ellipse cx="586" cy="510" rx="300" ry="106" fill="#000" opacity="0.74" filter="url(#sombra)"/>
    <ellipse cx="586" cy="452" rx="290" ry="150" fill="url(#plato)"/>
    <ellipse cx="586" cy="452" rx="290" ry="150" fill="none" stroke="#08090B" stroke-opacity="0.22" stroke-width="3"/>

    <g transform="rotate(-3 560 400)">
        <rect x="410" y="258" width="300" height="252" rx="8" fill="#000" opacity="0.5" filter="url(#sombra)"/>

        <rect x="410" y="240" width="300" height="256" rx="8" fill="url(#cacao)"/>
        <rect x="410" y="240" width="300" height="44" rx="8" fill="#835830" fill-opacity="0.34"/>

        <rect x="410" y="284" width="300" height="40" fill="url(#cremaR)"/>
        <rect x="410" y="324" width="300" height="42" fill="url(#esponja)"/>
        <rect x="410" y="366" width="300" height="38" fill="url(#cremaR)"/>
        <rect x="410" y="404" width="300" height="40" fill="url(#esponja)"/>
        <rect x="410" y="444" width="300" height="52" fill="url(#cremaR)"/>

        <path d="M410 240h300v22H410Z" fill="#5C3619" opacity="0.45"/>
        <g fill="#2B160A" opacity="0.5">
            <ellipse cx="452" cy="266" rx="16" ry="5"/>
            <ellipse cx="524" cy="254" rx="13" ry="4"/>
            <ellipse cx="604" cy="268" rx="15" ry="5"/>
            <ellipse cx="672" cy="256" rx="12" ry="4"/>
        </g>

        <rect x="410" y="240" width="300" height="256" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="2"/>
        <rect x="418" y="248" width="120" height="240" rx="6" fill="#F7F3EA" opacity="0.08"/>
    </g>

    <g transform="rotate(18 830 430)">
        <rect x="792" y="304" width="26" height="230" rx="13" fill="#D8D2C4"/>
        <rect x="796" y="300" width="18" height="60" rx="9" fill="#F2EEE4"/>
        <ellipse cx="805" cy="552" rx="34" ry="16" fill="#C6BFB0" opacity="0.8"/>
    </g>

    <rect width="1200" height="800" fill="url(#vineta)"/>
    <rect width="1200" height="800" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
