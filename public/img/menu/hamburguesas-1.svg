<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#2C2318"/>
            <stop offset="52%" stop-color="#15120E"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="28%" cy="8%" r="66%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="pan" x1="0.15" y1="0" x2="0.75" y2="1">
            <stop offset="0%" stop-color="#F0BE6C"/>
            <stop offset="42%" stop-color="#D99B41"/>
            <stop offset="100%" stop-color="#96601F"/>
        </linearGradient>

        <linearGradient id="panBase" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E2AE5C"/>
            <stop offset="100%" stop-color="#8B5518"/>
        </linearGradient>

        <linearGradient id="carne" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6B3A1E"/>
            <stop offset="50%" stop-color="#4A2412"/>
            <stop offset="100%" stop-color="#2A1208"/>
        </linearGradient>

        <linearGradient id="queso" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FBD871"/>
            <stop offset="100%" stop-color="#C08D14"/>
        </linearGradient>

        <linearGradient id="lechuga" x1="0" y1="0" x2="1" y2="0.6">
            <stop offset="0%" stop-color="#7FB247"/>
            <stop offset="55%" stop-color="#4E8A2C"/>
            <stop offset="100%" stop-color="#2F5A1B"/>
        </linearGradient>

        <radialGradient id="tomate" cx="36%" cy="28%" r="76%">
            <stop offset="0%" stop-color="#E0563A"/>
            <stop offset="100%" stop-color="#8E1D0F"/>
        </radialGradient>

        <radialGradient id="vineta" cx="50%" cy="46%" r="73%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.94"/>
        </radialGradient>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="24"/>
        </filter>

        <filter id="suave" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.45">
        <circle cx="1074" cy="190" r="34" fill="#F0C64A" opacity="0.5"/>
        <circle cx="96" cy="640" r="28" fill="#D6A928" opacity="0.35"/>
    </g>

    <ellipse cx="600" cy="600" rx="268" ry="52" fill="#000" opacity="0.78" filter="url(#sombra)"/>

    <g>
        <rect x="418" y="486" width="364" height="86" rx="40" fill="url(#panBase)"/>
        <rect x="418" y="486" width="364" height="86" rx="40" fill="url(#luz)" opacity="0.5"/>

        <rect x="406" y="436" width="388" height="66" rx="30" fill="url(#carne)"/>
        <rect x="406" y="436" width="388" height="20" rx="10" fill="#8A4C24" opacity="0.5"/>

        <path d="M402 424h396l-24 44-30-16-28 22-30-18-32 20-28-20-32 16-28-16-32 20-28-18-30 16Z" fill="url(#queso)"/>

        <ellipse cx="600" cy="424" rx="196" ry="34" fill="url(#tomate)"/>
        <ellipse cx="524" cy="412" rx="46" ry="14" fill="#F08A6C" opacity="0.35"/>

        <path d="M392 400c26-20 60-22 84-6 24-18 62-16 82 4 24-20 64-16 84 4 24-18 60-14 78 6 22-14 50-10 62 8l-14 40c-22 12-46 8-62-6-24 16-58 14-78-2-24 18-60 16-82-2-24 16-60 14-80-4-24 14-54 10-70-8Z" fill="url(#lechuga)"/>

        <path d="M400 388c0-116 88-198 200-198s200 82 200 198c-58 30-342 30-400 0Z" fill="url(#pan)"/>
        <path d="M400 388c0-116 88-198 200-198 34 0 66 10 94 28-64 34-104 96-108 170-62 8-124 8-186 0Z" fill="#FBD08A" opacity="0.35"/>

        <g fill="#FBF0CE" opacity="0.88">
            <ellipse cx="512" cy="330" rx="15" ry="8" transform="rotate(-24 512 330)"/>
            <ellipse cx="596" cy="296" rx="15" ry="8" transform="rotate(6 596 296)"/>
            <ellipse cx="672" cy="330" rx="15" ry="8" transform="rotate(26 672 330)"/>
            <ellipse cx="556" cy="252" rx="14" ry="7" transform="rotate(-10 556 252)"/>
            <ellipse cx="640" cy="256" rx="14" ry="7" transform="rotate(12 640 256)"/>
            <ellipse cx="468" cy="366" rx="13" ry="7" transform="rotate(-32 468 366)"/>
            <ellipse cx="730" cy="366" rx="13" ry="7" transform="rotate(32 730 366)"/>
        </g>
    </g>

    <ellipse cx="486" cy="286" rx="96" ry="46" fill="#F7F3EA" opacity="0.13" filter="url(#desenfoque)"/>

    <rect width="1200" height="800" fill="url(#vineta)"/>
    <rect width="1200" height="800" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
