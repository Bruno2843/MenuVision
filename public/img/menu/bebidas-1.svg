<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#2A2116"/>
            <stop offset="50%" stop-color="#14110D"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="34%" cy="10%" r="66%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="liquido" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0%" stop-color="#F6E27A"/>
            <stop offset="45%" stop-color="#E0BC2E"/>
            <stop offset="100%" stop-color="#9A7A10"/>
        </linearGradient>

        <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#F7F3EA" stop-opacity="0.30"/>
            <stop offset="28%" stop-color="#F7F3EA" stop-opacity="0.05"/>
            <stop offset="72%" stop-color="#F7F3EA" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#F7F3EA" stop-opacity="0.24"/>
        </linearGradient>

        <radialGradient id="vineta" cx="50%" cy="46%" r="73%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.93"/>
        </radialGradient>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="suave" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="73"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.5">
        <circle cx="1066" cy="210" r="30" fill="#F0C64A" opacity="0.5"/>
        <circle cx="150" cy="580" r="26" fill="#D6A928" opacity="0.35"/>
    </g>

    <g transform="rotate(4 600 450)">
        <ellipse cx="600" cy="628" rx="216" ry="52" fill="#000" opacity="0.76" filter="url(#sombra)"/>

        <path d="M470 216h260l-26 388a34 34 0 0 1-34 32H530a34 34 0 0 1-34-32Z" fill="url(#liquido)"/>

        <g fill="#FBF6DC" opacity="0.42">
            <rect x="512" y="316" width="66" height="66" rx="10" transform="rotate(-14 545 349)"/>
            <rect x="586" y="278" width="62" height="62" rx="10" transform="rotate(10 617 309)"/>
            <rect x="540" y="418" width="70" height="70" rx="10" transform="rotate(6 575 453)"/>
            <rect x="622" y="440" width="60" height="60" rx="10" transform="rotate(-10 652 470)"/>
            <rect x="520" y="518" width="64" height="64" rx="10" transform="rotate(14 552 550)"/>
        </g>

        <g fill="#FFFDF0" opacity="0.55">
            <rect x="520" y="326" width="22" height="22" rx="4" transform="rotate(-14 531 337)"/>
            <rect x="594" y="288" width="20" height="20" rx="4" transform="rotate(10 604 298)"/>
            <rect x="548" y="428" width="22" height="22" rx="4" transform="rotate(6 559 439)"/>
        </g>

        <path d="M470 216h260l-26 388a34 34 0 0 1-34 32H530a34 34 0 0 1-34-32Z" fill="url(#vidrio)"/>
        <ellipse cx="600" cy="216" rx="130" ry="26" fill="#F7F3EA" opacity="0.14"/>
        <ellipse cx="600" cy="216" rx="118" ry="21" fill="none" stroke="#F7F3EA" stroke-opacity="0.34" stroke-width="3"/>

        <g fill="#5E8F3E">
            <path d="M498 268c30-24 62-16 72 6-14 30-48 40-74 22-16-11-14-22 2-28Z"/>
            <path d="M656 322c26-20 54-13 63 7-12 26-42 34-65 18-14-9-12-20 2-25Z"/>
            <path d="M534 592c24-18 50-12 58 6-11 24-38 31-59 16-12-8-11-18 1-22Z"/>
        </g>

        <g fill="none" stroke="#4E8A2C" stroke-width="3" opacity="0.8">
            <path d="M520 240c-24 40-30 84-20 128"/>
            <path d="M676 296c22 44 26 92 14 140"/>
        </g>

        <rect x="508" y="250" width="22" height="300" rx="11" fill="#FFFFFF" opacity="0.20" filter="url(#suave)"/>
    </g>

    <rect width="1200" height="800" fill="url(#vineta)"/>
    <rect width="1200" height="800" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
