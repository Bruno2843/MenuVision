<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0.9" y1="0" x2="0.1" y2="1">
            <stop offset="0%" stop-color="#241B12"/>
            <stop offset="55%" stop-color="#131009"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="26%" cy="80%" r="70%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="papel" cx="38%" cy="30%" r="78%">
            <stop offset="0%" stop-color="#F3EDE1"/>
            <stop offset="100%" stop-color="#B9AE99"/>
        </radialGradient>

        <radialGradient id="panT" cx="34%" cy="26%" r="80%">
            <stop offset="0%" stop-color="#F1C072"/>
            <stop offset="55%" stop-color="#D79A41"/>
            <stop offset="100%" stop-color="#8E5A1D"/>
        </radialGradient>

        <linearGradient id="carneT" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7A4222"/>
            <stop offset="100%" stop-color="#3A1B0C"/>
        </linearGradient>

        <linearGradient id="frita" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0%" stop-color="#F6CE6C"/>
            <stop offset="55%" stop-color="#E0A233"/>
            <stop offset="100%" stop-color="#A96D12"/>
        </linearGradient>

        <radialGradient id="vineta" cx="48%" cy="48%" r="72%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.93"/>
        </radialGradient>

        <filter id="borde" x="-12%" y="-12%" width="124%" height="124%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="13" result="ruido"/>
            <feDisplacementMap in="SourceGraphic" in2="ruido" scale="12" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="29"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.5">
        <circle cx="1120" cy="640" r="30" fill="#F0C64A" opacity="0.45"/>
        <circle cx="70" cy="150" r="24" fill="#D6A928" opacity="0.35"/>
    </g>

    <g transform="translate(690 430) rotate(12)">
        <ellipse cx="0" cy="120" rx="230" ry="86" fill="#000" opacity="0.7" filter="url(#sombra)"/>
        <rect x="-220" y="-70" width="440" height="270" rx="30" fill="url(#papel)"/>
        <rect x="-220" y="-70" width="440" height="270" rx="30" fill="#08090B" opacity="0.18"/>

        <g filter="url(#borde)">
            <rect x="-176" y="-34" width="352" height="60" rx="12" fill="url(#frita)" transform="rotate(-12)"/>
            <rect x="-150" y="6" width="352" height="58" rx="12" fill="url(#frita)" transform="rotate(6)"/>
            <rect x="-190" y="44" width="352" height="58" rx="12" fill="url(#frita)" transform="rotate(-4)"/>
            <rect x="-120" y="84" width="330" height="56" rx="12" fill="url(#frita)" transform="rotate(14)"/>
        </g>

        <g fill="#FFF3D2" opacity="0.28">
            <rect x="-160" y="-16" width="300" height="10" rx="5" transform="rotate(-12)"/>
            <rect x="-134" y="24" width="300" height="10" rx="5" transform="rotate(6)"/>
        </g>
    </g>

    <g transform="translate(420 400)">
        <ellipse cx="0" cy="150" rx="222" ry="66" fill="#000" opacity="0.72" filter="url(#sombra)"/>

        <g filter="url(#borde)">
            <circle cx="0" cy="0" r="196" fill="url(#carneT)"/>
        </g>
        <circle cx="0" cy="0" r="176" fill="url(#carneT)"/>
        <circle cx="0" cy="0" r="176" fill="#F0C64A" opacity="0.08"/>

        <g filter="url(#borde)">
            <circle cx="0" cy="0" r="162" fill="url(#panT)"/>
        </g>
        <circle cx="-46" cy="-52" r="76" fill="#FBD08A" opacity="0.28"/>

        <g fill="#FBF0CE" opacity="0.85">
            <ellipse cx="-52" cy="-40" rx="13" ry="7" transform="rotate(-24 -52 -40)"/>
            <ellipse cx="34" cy="-72" rx="13" ry="7" transform="rotate(8 34 -72)"/>
            <ellipse cx="76" cy="10" rx="12" ry="6" transform="rotate(30 76 10)"/>
            <ellipse cx="-88" cy="34" rx="12" ry="6" transform="rotate(-30 -88 34)"/>
            <ellipse cx="6" cy="88" rx="12" ry="6" transform="rotate(10 6 88)"/>
        </g>

        <path d="M-70 -116a150 150 0 0 0 132 190 150 150 0 0 1 -132-190Z" fill="#7A1E12" opacity="0.55"/>
    </g>

    <rect width="1200" height="800" fill="url(#vineta)"/>
    <rect width="1200" height="800" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
