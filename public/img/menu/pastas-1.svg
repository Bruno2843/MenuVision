<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
    <defs>
        <linearGradient id="mesa" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#281F15"/>
            <stop offset="52%" stop-color="#14110D"/>
            <stop offset="100%" stop-color="#08090B"/>
        </linearGradient>

        <radialGradient id="luz" cx="68%" cy="14%" r="70%">
            <stop offset="0%" stop-color="#F0C64A" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#D6A928" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="plato" cx="36%" cy="26%" r="80%">
            <stop offset="0%" stop-color="#FBF8F1"/>
            <stop offset="58%" stop-color="#E4DED2"/>
            <stop offset="100%" stop-color="#9E9689"/>
        </radialGradient>

        <linearGradient id="crema" x1="0.1" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#FDF3D8"/>
            <stop offset="55%" stop-color="#EFDCAC"/>
            <stop offset="100%" stop-color="#C9A863"/>
        </linearGradient>

        <linearGradient id="fideo" x1="0" y1="0" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#F8E6BC"/>
            <stop offset="60%" stop-color="#E4C98E"/>
            <stop offset="100%" stop-color="#B99A5C"/>
        </linearGradient>

        <radialGradient id="vineta" cx="50%" cy="46%" r="73%">
            <stop offset="50%" stop-color="#08090B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#08090B" stop-opacity="0.93"/>
        </radialGradient>

        <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="24"/>
        </filter>

        <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="7"/>
        </filter>

        <filter id="desenfoque" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="20"/>
        </filter>

        <filter id="grano" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="41"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#mesa)"/>
    <rect width="1200" height="800" fill="url(#luz)"/>

    <g filter="url(#desenfoque)" opacity="0.45">
        <circle cx="150" cy="180" r="30" fill="#F0C64A" opacity="0.5"/>
        <circle cx="1090" cy="620" r="24" fill="#D6A928" stop-opacity="0.4"/>
    </g>

    <ellipse cx="600" cy="500" rx="316" ry="118" fill="#000" opacity="0.74" filter="url(#sombra)"/>

    <ellipse cx="600" cy="436" rx="304" ry="176" fill="url(#plato)"/>
    <ellipse cx="600" cy="436" rx="304" ry="176" fill="none" stroke="#08090B" stroke-opacity="0.25" stroke-width="3"/>
    <ellipse cx="600" cy="424" rx="238" ry="132" fill="#CFC7B8" opacity="0.5"/>

    <g>
        <ellipse cx="600" cy="432" rx="214" ry="120" fill="url(#crema)"/>

        <g fill="none" stroke="url(#fideo)" stroke-width="17" stroke-linecap="round">
            <path d="M416 420c58-56 168-64 232-16"/>
            <path d="M440 466c66-50 172-52 236-4"/>
            <path d="M452 380c62-42 158-44 214 2"/>
            <path d="M470 500c58-38 150-38 208 4"/>
            <path d="M500 348c56-30 132-28 180 8"/>
            <path d="M520 528c48-28 122-24 166 10"/>
        </g>

        <g fill="#FFF8E0" opacity="0.65">
            <ellipse cx="512" cy="396" rx="52" ry="16" transform="rotate(-8 512 396)"/>
            <ellipse cx="660" cy="470" rx="44" ry="14" transform="rotate(6 660 470)"/>
        </g>

        <g fill="#C9A227" opacity="0.6">
            <circle cx="556" cy="404" r="4"/>
            <circle cx="612" cy="382" r="3.5"/>
            <circle cx="672" cy="418" r="4"/>
            <circle cx="590" cy="456" r="3.5"/>
            <circle cx="700" cy="382" r="3"/>
            <circle cx="480" cy="452" r="3"/>
        </g>

        <path d="M634 348c22-14 46-4 50 13-10 20-34 26-54 14-11-7-9-20 4-27Z" fill="#4E8A2C"/>
    </g>

    <ellipse cx="452" cy="332" rx="96" ry="44" fill="#F7F3EA" opacity="0.14" filter="url(#desenfoque)"/>

    <rect width="1200" height="800" fill="url(#vineta)"/>
    <rect width="1200" height="800" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
